<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!--
    Same viewport line as the real page, so what happens here is what
    would happen there. viewport-fit=cover included; no user-scalable
    lock, because the 16px font below is what stops the focus zoom.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!--
    The three the real page carries and this one did not. Copied verbatim,
    because the point of a control is that it differs in nothing — and
    then both pages had their theme-color corrected together, see below.

    What each actually does, since it matters for what to expect:

    apple-mobile-web-app-capable — nothing at all in Safari. It only bites
    when the page is launched from the Home Screen, where it runs
    standalone. Worth knowing that this is the mode ask-nereus-client is
    always in, and standalone is exactly where the whole problem does not
    exist: the web view resizes for the keyboard and there is no floating
    bar to paint behind.

    apple-mobile-web-app-status-bar-style — standalone only as well. In
    Safari it is inert, so black-translucent does not make anything
    transparent here.

    theme-color — this one does act in Safari: it tints the chrome, the
    bottom bar included. It colours the BAR rather than the strip of page
    under it, so it is not expected to fix the bottom; what it does do is
    stop Safari sampling a colour of its own choosing, which is a real
    difference between this page and the real one and is why it is here.
  -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- #E3E5E6, the same as --background in css/common.css.
       
       It was #E4E6E7 — one step off on every channel — and that is the
       seam. theme-color is what Safari tints its chrome with, including
       the strip the bottom bar floats on, so a theme-color that is not
       the page colour is a join between two greys that are nearly but
       not quite the same. Will: "we could keep the bottom notch uniform
       color." If it is going to be flat it should at least be the same
       flat. -->
  <meta name="theme-color" content="#E3E5E6" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#E3E5E6" media="(prefers-color-scheme: light)">

  <meta name="robots" content="noindex">
  <title>Keyboard test</title>

  <!--
    ===================================================================
    One page. No script.

    The structure Will asked for:

      <body>            height: 100dvh          the page
        <main>          height: 100%            the first page, whole
          #content      flex: 1                 text, and where answers go
          <form>        margin-top: auto        pushed to the bottom
            chips
            the input row
        </main>

    body is the viewport and nothing else — no layout of its own. main is
    the macro container and is the same height as body, so "the first
    page" is one element you can point at rather than a set of siblings
    that happen to add up.

    #content is flex: 1, which is what makes the whole thing work: it has
    no height of its own, it takes whatever is left once the form has
    taken what it needs. So when the shell shrinks — the toolbar moving,
    the keyboard arriving — #content is what gives, and the form is
    carried down rather than squeezed or pushed off the bottom. If
    #content were 100% instead, it would fill main on its own and the
    form would sit below the fold.

    The chips moved INSIDE the form, with the input row beside them. The
    glass moved with the input row rather than staying on the form, since
    the form is now a container for two things and only one of them is a
    pill.

    WHY THERE IS NOTHING ELSE HERE. Three pieces went out with the second
    page, and each existed only because the page scrolled:

      --hero-height and --chrome-slack, which made the first screen
      taller than the viewport so the dark section started below the
      bottom of the screen in every toolbar state.

      --portrait-sink, which hung the photograph below the first screen
      so its cropped bottom edge was covered by the page that followed.

      the :has() switch, which took the second page out of the document
      and locked the scroll.

    And the floating bar went with them. Safari floats its bottom bar
    over a page that SCROLLS and docks it above one that does not; docked
    it has its own backdrop and the page ends cleanly above it. That is
    the solid notch, got by not fighting for the strip rather than by
    painting it — and every repair that failed tonight failed against
    that one fact.
    ===================================================================
  -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,200;0,300;0,400;0,500&display=swap">

  <style>
    /* ── Tokens, lifted from css/common.css ────────────────────────── */
    :root {
      --color: #111;
      --background: #E3E5E6;
      --liquid-glass-background: white;
      --liquid-glass-border-color: var(--liquid-glass-background);
      --send: #FFFFFFEE;
      --blur-filter: blur(10px) saturate(180%);

      --border-radius-round: max(100vw, 100vh);

      --safearea-top: env(safe-area-inset-top, 0px);
      --safearea-bottom: env(safe-area-inset-bottom, 0px);

      --padding: min(max(2.4169dvw, 16px), 24px);
      --safearea-padding-top: calc(var(--safearea-top) + var(--padding));
      --safearea-padding-bottom: calc(var(--safearea-bottom) + var(--padding));

      --main-width: max(512px, 40%);
      --main-max-width: calc(100dvw - 2 * var(--padding));
      --chat-form-height: min(max(6.2840dvw, 48px), 56px);

      /* ── The portrait ───────────────────────────────────────────── */

      /* 74.2vw is the mock's width: he is 0.36 of the window across in
         it, and at 0.485 of the crop that needs 0.742 of the window. The
         other term is the mock's height. On the mock's own aspect the
         height binds; on a tall narrow window the width binds instead
         and keeps him off the headline rather than letting a tall window
         inflate him. Measured off 100dvh, because the page is the
         viewport now. */
      --portrait-crop: min(74.2vw, calc(0.9324 * 100dvh));
      /* He is 77.5% of the crop's width and the crop is 0.6260 as wide
         as it is tall (1252/2000), so 0.485 of its height. */
      --portrait-width: calc(0.485 * var(--portrait-crop));
      /* What the headline needs at the top of a narrow screen. svh, not
         dvh: this sets how far down he starts, and a value that tracks
         the toolbar makes him drift. */
      --portrait-top: clamp(224px, 35svh, 300px);
      --portrait-height: var(--portrait-crop);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── The page ──────────────────────────────────────────────────── */
    /* The viewport, and no layout of its own: main does the arranging. */
    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    /* No padding and no position: body is the viewport and the colour
       under everything, and that is all. The gutters moved into main so
       that main can be full-bleed — the photograph belongs to the first
       page, and a first page inset by the page gutter would stop short
       of the screen edges. */
    body {
      background: var(--background);
      color: var(--color);
      font-family: Poppins, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 300;
      line-height: 1.5;
    }

    /* ── The first page, whole ─────────────────────────────────────── */
    /* Full width now, with the gutters and the safe areas on it rather
       than on body — so the photograph below can reach the screen edges
       while the column inside is still inset.
       
       The column is no longer main's own width; #content and the form
       carry it and are centred by align-items. */
    main {
      position: relative;
      height: 100%;
      width: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;

      padding: 0 var(--padding);
      padding-top: var(--safearea-padding-top);
      padding-bottom: var(--safearea-padding-bottom);
    }

    /*
     * The photograph: the whole first page, anchored bottom right.
     *
     * Will: "The hero picture can live in the main background or as an
     * absolute div with proper z index." It is the second of those, as a
     * pseudo-element rather than a div so it costs no node. Not main's
     * background, because main has padding and a background is painted
     * inside the padding box — he would stop a gutter short of the
     * screen edges. inset: 0 resolves against the padding box too but
     * the padding box IS the whole element here, since there is no
     * border, so an absolute layer reaches the edges and a background
     * image would not.
     *
     * No overhang and nothing to hide it under, so there is nothing for
     * body's overflow to clip. His bottom edge is the bottom of the
     * page, and below the page is Safari's docked bar on its own
     * backdrop.
     *
     * z-index 0 against the 1 on #content and the form: he is behind the
     * writing and in front of nothing. Negative would put him behind
     * body's background, which is opaque, and he would vanish.
     *
     * position: absolute also keeps him out of the flex column, so the
     * arrangement under test is untouched by his being here at all.
     */
    main::before {
      content: "";
      position: absolute;
      inset: 0;
      background: url("assets/background.webp") no-repeat right bottom
                  / auto var(--portrait-height);
      z-index: 0;
    }

    /* The spacer that centres the column on a wide screen: half the
       slack above the form and half below, so the form lands in the
       middle rather than at the bottom. Zero on a phone. */
    main::after {
      content: "";
      flex: 0 0 0;
      min-height: 0;
    }

    /* ── The content, and what gives when the page shrinks ─────────── */
    /*
     * flex: 1 and no height of its own. This is the piece the whole
     * arrangement rests on: it takes whatever is left once the form has
     * taken what it needs, so a shrinking shell comes out of here and
     * the form is carried down rather than squeezed or pushed off.
     *
     * min-height: 0 because a flex item's default min-height is auto,
     * which refuses to shrink below its content — and refusing is
     * exactly what must not happen.
     */
    #content {
      position: relative;
      z-index: 1;
      width: var(--main-width);
      max-width: var(--main-max-width);

      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Vertical centring by auto margins rather than justify-content, so
       that an overflowing child still starts at the top instead of being
       cut off at both ends. */
    #content::before,
    #content::after { content: ""; margin: auto; }

    /* ── The headline ──────────────────────────────────────────────── */
    #welcome {
      --h1-size: min(max(3.6254vw, 28px), 32px);
      --h2-size: min(max(2.2961vw, 18px), 20px);
      --span-size: min(max(1.8127vw, 14px), 16px);

      display: flex;
      flex-direction: column;
      width: 100%;
      justify-content: center;
      align-items: center;
      color: rgb(from var(--color) r g b / 0.8);
      font-size: var(--span-size);
      text-align: center;
    }

    #welcome > div:first-of-type {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    #welcome .greeting,
    #welcome h1 {
      font-weight: 400;
      margin: 0;
      padding: 0;
      margin-inline: auto;
    }

    #welcome h1 { font-size: var(--h1-size); }

    #welcome .greeting {
      font-weight: 200;
      font-size: var(--h2-size);
    }

    #welcome b { font-weight: 500; }

    /* 1.24em is an optical match, not a nominal one: Poppins has an
       x-height of 54.8 at 100px and Times italic 44.19, so Times at the
       same nominal size reads as a step DOWN. 54.8 / 44.19 = 1.24 puts
       the x-heights level, which is the right target for a word with no
       capital in it. The stack ends in generic serif because Times New
       Roman is not on Android or most Linux. */
    #welcome h1 .accent {
      font-family: "Times New Roman", Times, serif;
      font-style: italic;
      font-size: 1.24em;
    }

    /* ── The material ──────────────────────────────────────────────── */
    .liquid-glass {
      background: rgb(from var(--liquid-glass-background) r g b / 0.05);
      backdrop-filter: var(--blur-filter);
      -webkit-backdrop-filter: var(--blur-filter);
      --shadow1: inset -8px -8px 20px rgb(from var(--liquid-glass-border-color) r g b / 0.3);
      --shadow2: inset 0 0 0 1px rgb(from var(--liquid-glass-border-color) r g b / 0.1);
      --shadow3: 0 2px 8px rgba(0, 0, 0, 0.05);
      --shadow: var(--shadow1), var(--shadow2), var(--shadow3);
      box-shadow: var(--shadow);
      -webkit-box-shadow: var(--shadow);
    }

    /* ── The form: the chips and the input ─────────────────────────── */
    /*
     * margin-top: auto as well as flex-shrink: 0, so it is pinned to the
     * bottom of main whatever #content does — including an empty
     * #content, where flex: 1 has nothing to grow from.
     *
     * The form is a column holding two things: a row of chips and the
     * input row. The glass is on the input row rather than on the form,
     * because only one of the two is a pill.
     */
    #chat-input-form {
      position: relative;
      z-index: 1;
      width: var(--main-width);
      max-width: var(--main-max-width);

      flex-shrink: 0;
      margin-top: auto;
      display: flex;
      flex-direction: column;
    }

    #chat-input-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      grid-template-rows: auto;
      min-height: var(--chat-form-height);
      border-radius: calc(0.5 * var(--chat-form-height) + 4px);
      padding: 8px;
    }

    #chat-input {
      grid-column: 2;
      grid-row: 1;
      width: 100%;
      max-height: 30svh;
      resize: none;
      overflow-x: hidden;
      overflow-y: auto;
      color: inherit;
      background: none;
      outline: none;
      box-shadow: none;
      cursor: text;

      margin: 0;
      /* 8px of form padding leaves the text against the rim of a bar
         this wide; 20 on the leading edge is simply the inset. */
      padding: 0 8px 0 20px;
      border: 0;

      /* Longhand, not a `font:` shorthand: `font: ... inherit` is
         invalid — inherit cannot stand in for the family — so the whole
         declaration is dropped and the field falls back to the UA
         default, which measured 13.33px. In the page built to test the
         zoom. */
      font-family: inherit;
      font-weight: 400;
      /* 16px, and it cannot go below it: iOS zooms the whole page in
         when you focus a field under 16px, which moved the portrait, ran
         the bar off both edges, and put every visualViewport number in
         zoomed units. */
      font-size: 16px;
      line-height: 1.5;
      align-self: center;
    }

    #chat-input::placeholder {
      color: inherit;
      font-style: italic;
      opacity: 0.7;
    }

    #send {
      grid-column: 3;
      grid-row: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      height: calc(var(--chat-form-height) - 16px);
      aspect-ratio: 1 / 1;
      border: 0;
      border-radius: var(--border-radius-round);
      background: var(--send);
      color: var(--color);
      cursor: pointer;
    }

    /* One line, scrolling rather than wrapping. `safe center` matters:
       with plain `center` a row wider than its box overflows equally
       both ways and the left end becomes unreachable, because you cannot
       scroll to negative. The width/translate pair lets the row be wider
       than the column when the labels need it. */
    #starter-chips {
      display: flex;
      flex-wrap: nowrap;
      justify-content: safe center;
      gap: 8px;
      width: max-content;
      max-width: var(--main-max-width);
      margin: 14px 0 0 50%;
      translate: -50% 0;
      overflow-x: auto;
      scrollbar-width: none;
      overscroll-behavior-x: contain;
      padding: 2px 0;
      touch-action: pan-x;
    }

    #starter-chips::-webkit-scrollbar { display: none; }

    /* The real page sets [overflowing] from the scroll position so the
       fade is never on an edge with nothing behind it. No script here,
       so the end fade is written on the element in the markup. */
    #starter-chips[overflowing="end"] {
      mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent);
    }

    .starter-chip {
      flex: 0 0 auto;
      white-space: nowrap;
      font-family: inherit;
      font-size: 0.9em;
      text-align: left;
      /* 300, not the 400 a <button> inherits: the body is 300 and the
         headline is 400, so a 400 chip was the heaviest text on a screen
         that is mostly whitespace. Held to 72% so the row settles under
         the headline; full strength under 900px, where the chips sit on
         the portrait and one over the navy suit measured 4.9:1. */
      font-weight: 300;
      color: rgb(from var(--color) r g b / 0.72);

      -webkit-tap-highlight-color: transparent;
      border: 0;
      border-radius: var(--border-radius-round);
      padding: 9px 16px;
      cursor: pointer;
      max-width: 100%;
    }

    /* ── The opening state, on a wide screen ───────────────────────── */
    @media only screen and (min-width: 901px) {
      /* He stands to the right and the writing keeps out of his way.
         Padding the first page by his width makes that automatic: the
         column is centred by main's align-items, and that is now
         centring it in what is left. */
      main {
        padding-left: var(--padding);
        padding-right: calc(var(--padding) + var(--portrait-width));
      }

      /* As load-bearing as the padding: --main-max-width is measured off
         the VIEWPORT, which knows nothing about the space reserved for
         him, so without this a 512px form runs under him anyway. */
      #content, #chat-input-form, #starter-chips { max-width: 100%; }

      /* Half the slack above the form and half below, so it lands in the
         middle rather than at the bottom. */
      main::after { flex-grow: 1; }

      /* And the headline sits at the BOTTOM of the content box, directly
         above the form, rather than centred in a box that is now much
         taller than it. Releasing the trailing auto margin leaves the
         leading one to take all the slack. */
      #content::after { margin: 0; }

      #welcome { padding-bottom: 32px; }
    }

    /* ── Phone ─────────────────────────────────────────────────────── */
    @media only screen and (max-width: 900px) {
      /* At crop height he is taller than the phone is wide, so he fills
         the screen and the headline, the chips and the form sit on top
         of him. Sizing him to what is left under the headline keeps the
         top clear and puts the chips and the form over his legs.
         
         No sink: that bought height by hanging him below the first
         screen, and there is nothing below it to hang into. This is
         where Will asked him to stay — head at --portrait-top. */
      :root {
        --portrait-height: calc(100svh - var(--portrait-top));
      }

      /* The headline goes to the top of the content box rather than the
         middle of it. */
      #content::before { margin: 0; }
      #welcome > div:first-of-type { gap: 8px; }
      #content { padding-top: 48px; }

      /* The form is already at the bottom on a phone, so the chips go
         ABOVE the input rather than below it. */
      #starter-chips {
        order: -1;
        margin: 0 0 14px 50%;
      }

      /* Full strength here: the chips sit ON the portrait and which one
         you can read depends on what is behind it. */
      .starter-chip { color: var(--color); }
      .starter-chip.liquid-glass {
        background: rgb(from var(--liquid-glass-background) r g b / 0.5);
        --shadow2: inset 0 0 0 1px rgb(from var(--liquid-glass-border-color) r g b / 0.4);
      }
    }

    @media only screen and (max-width: 512px) {
      #chat-input-row.liquid-glass {
        background: rgb(from var(--liquid-glass-background) r g b / 0.5);
        --shadow2: inset 0 0 0 1px rgb(from var(--liquid-glass-border-color) r g b / 0.4);
      }
    }
  </style>
</head>
<body>

  <main>
    <!-- The text, and where an answer would render. flex: 1, so this is
         what gives when the page shrinks. -->
    <div id="content">
      <div id="welcome">
        <div>
          <!-- A <p>, not an <h2>: it reads as a line above the title,
               and as an h2 it put a level two ahead of the level one for
               anyone moving through the page by heading. -->
          <p class="greeting">Hi, I'm <b>William</b> Brendel</p>
          <h1>Where should we <span class="accent">start?</span></h1>
        </div>
      </div>
    </div>

    <!-- Pushed to the bottom of main, holding the chips and the input. -->
    <form id="chat-input-form" onsubmit="return false">
      <div id="chat-input-row" class="liquid-glass">
        <textarea id="chat-input" placeholder="Ask me anything…" rows="1"
                  autocomplete="off" autocorrect="off" autocapitalize="off"
                  spellcheck="false"></textarea>
        <button id="send" type="submit" aria-label="Send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
          </svg>
        </button>
      </div>
      <!-- The four real starters (server/config.js STARTERS), hard-coded.
           AFTER the input row in the DOM, which is what puts them below
           the bar on a wide screen; order: -1 under 900px lifts them
           above it, where the bar is already at the bottom. -->
      <div id="starter-chips" aria-label="Suggested questions" overflowing="end">
        <button class="starter-chip liquid-glass" type="button">A time I failed</button>
        <button class="starter-chip liquid-glass" type="button">A time I disagreed</button>
        <button class="starter-chip liquid-glass" type="button">A call under pressure</button>
        <button class="starter-chip liquid-glass" type="button">My biggest obstacle</button>
      </div>
    </form>
  </main>

</body>
</html>
