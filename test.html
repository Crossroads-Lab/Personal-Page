<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!--
    Same viewport line as the real page, so what happens here is what
    would happen there. viewport-fit=cover included; no user-scalable
    lock, because the 16px font below is what stops the focus zoom.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Keyboard test</title>

  <!--
    ===================================================================
    A control.

    One headline, one input. No script of any kind, no portrait, no
    chips, no second section, no cut. Everything that has been blamed
    tonight is absent, so whatever this does is the browser.

    The layout is ask-nereus-client's, which is the thing we are testing:

      html, body { height: 100dvh; overflow: hidden }
      body       { display: flex; flex-direction: column }
      the bar    { flex-shrink: 0 }

    dvh is the dynamic viewport — whatever the browser is giving you at
    that moment. If it follows the keyboard, the bar rides down to sit on
    the keys and nothing else is needed. If it does not, the bar stays
    where it was and the keys cover it, and that is the answer.
    ===================================================================
  -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;

      background: #E3E5E6;
      color: #2b2b2b;
      font: 300 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

      padding: 24px 16px;
      padding-top: calc(24px + env(safe-area-inset-top, 0px));
      padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    }

    /* The headline, at the top. Nothing else up here. */
    header {
      flex-shrink: 0;
      text-align: center;
      padding-top: 48px;
    }

    header p { font-size: 18px; opacity: 0.75; }
    header h1 { font-size: 32px; font-weight: 600; margin-top: 8px; }

    /* The gap between them is the thing under test: it is whatever is
       left over, so when the shell shrinks, this is what gives. */
    main { flex: 1; }

    /* The bar, at the bottom, last item in the shell, never shrinks —
       exactly how ask-nereus-client carries its own. */
    form {
      flex-shrink: 0;
      width: 100%;
      max-width: 640px;
      display: flex;
      align-items: center;
      gap: 8px;

      background: #fff;
      border-radius: 999px;
      padding: 10px 10px 10px 20px;
      box-shadow: 0 2px 10px rgb(0 0 0 / 0.08);
    }

    input {
      flex: 1;
      border: 0;
      outline: 0;
      background: none;
      /* 16px exactly. Anything under it and iOS zooms the page on focus,
         which was a full round of this tonight.
         
         Written out rather than as a font shorthand: `font: ... inherit`
         is invalid — inherit cannot stand in for the family there — so
         the whole declaration is dropped and the field falls back to the
         UA default, which measured 13.33px. In the page built to test
         the zoom. Caught before it shipped, by reading the computed
         value rather than the source. */
      font-family: inherit;
      font-style: italic;
      font-weight: 300;
      font-size: 16px;
      line-height: 1.5;
      color: inherit;
    }

    input::placeholder { color: #8a8d8f; }

    button {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      background: #ECEEEF;
      color: #2b2b2b;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <p>Hi, I'm <strong>William</strong> Brendel</p>
    <h1>Where should we start?</h1>
  </header>

  <main></main>

  <form onsubmit="return false">
    <input type="text" placeholder="Ask me anything…" autocomplete="off"
           autocorrect="off" autocapitalize="off" spellcheck="false">
    <button type="submit" aria-label="Send">↑</button>
  </form>

</body>
</html>
