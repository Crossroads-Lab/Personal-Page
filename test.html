<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!--
    Same viewport line as the real page, so what happens here is what
    would happen there. viewport-fit=cover included; no user-scalable
    lock, because the 16px font below is what stops the focus zoom.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!--
    The three the real page carries and this one did not. Copied verbatim,
    including the #E4E6E7 that is one step off the page's own #E3E5E6,
    because the point of a control is that it differs in nothing.

    What each actually does, since it matters for what to expect:

    apple-mobile-web-app-capable — nothing at all in Safari. It only bites
    when the page is launched from the Home Screen, where it runs
    standalone. Worth knowing that this is the mode ask-nereus-client is
    always in, and standalone is exactly where the whole problem does not
    exist: the web view resizes for the keyboard and there is no floating
    bar to paint behind.

    apple-mobile-web-app-status-bar-style — standalone only as well. In
    Safari it is inert, so black-translucent does not make anything
    transparent here.

    theme-color — this one does act in Safari: it tints the chrome, the
    bottom bar included. It colours the BAR rather than the strip of page
    under it, so it is not expected to fix the bottom; what it does do is
    stop Safari sampling a colour of its own choosing, which is a real
    difference between this page and the real one and is why it is here.
  -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#E4E6E7" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#E4E6E7" media="(prefers-color-scheme: light)">

  <meta name="robots" content="noindex">
  <title>Keyboard test</title>

  <!--
    ===================================================================
    A control.

    Still no script of any kind, and still no portrait — those are the
    two things that make it a control, and they have not changed. What
    HAS been added is the type and the chips, because a bar that behaves
    on a bare page and misbehaves on the real one is only useful if the
    difference between the two is small enough to name. It now is: the
    real first screen minus the photograph and minus every line of JS.

    The layout is ask-nereus-client's, which is the thing being tested:

      html, body { height: 100dvh; overflow: hidden }
      body       { display: flex; flex-direction: column }
      main       { flex: 1 }            <- absorbs the shrink
      the bar    { last child, flex-shrink: 0 }

    dvh is the dynamic viewport. If it follows the keyboard, main gives
    up the room and the bar rides down onto the keys. If it does not —
    and the spec says the keyboard resizes only the VISUAL viewport
    unless interactive-widget says otherwise — then this page is exactly
    one layout viewport tall with the bar at the bottom and nothing to
    scroll, so Safari slides the visual viewport to bring the field into
    view and the bar arrives on the keys that way instead.

    Which of those two it is, this page cannot tell you. What it can
    tell you, and did, is that the arrangement works. css/more.css now
    carries the same two rules for the real page while someone is
    typing, written so it is correct either way.

    THE ONE THING THIS PAGE CANNOT MATCH, and it is worth writing down
    because three separate repairs were spent on it:

    The photograph is cut off at the bottom here and is not cut off on
    the real page. That is not the picture, the box, or the clip. It is
    that the real page SCROLLS and this one does not. Safari floats its
    bottom bar over a scrollable page — which is why the real page paints
    under it — and docks the bar on a page that does not scroll, where it
    gets its own backdrop and the page genuinely ends above it.

    So the line everything stopped at really is the bottom of the
    viewport here, and nothing a page can draw gets past it. Tried and
    failed, in order: a taller absolute box (clipped by body's overflow
    at 100dvh), overflow: clip on the shell instead of hidden (`hidden`
    is a scroll container that refuses the finger but not Safari's own
    scroll-into-view — scrollTo(500) moved it to 85), position: fixed
    (iOS clips fixed boxes to the layout viewport), and the canvas
    background (painting area is the whole canvas, and it changed
    nothing, which is what proved the line is the viewport).

    This page has to be exactly one screen with nothing to scroll — that
    is what makes it a keyboard control — so it cannot also have the
    floating bar. The cut is expected. It does not reach the real page:
    at rest that page scrolls and the portrait paints under the bar, and
    while typing body goes to height: 100dvh and overflow: clip, where
    the bar docks but its edge lands exactly where the keyboard starts.

    Everything below is copied from the real stylesheets rather than
    re-invented, so a difference in behaviour is a difference in the
    page and not in the CSS. Where a rule needed JS to earn its keep —
    the chip row's overflow fade, the stagger on entry, the focus
    states — it is either hard-coded or left out, and said so.
    ===================================================================
  -->

  <!-- Poppins, plain. The real page defers it behind an onload handler;
       there is no script here, so it is a stylesheet link. Same family,
       same weights that get used: 200 greeting, 300 chips, 400 headline
       and field. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,200;0,300;0,400;0,500&display=swap">

  <style>
    /* ── Tokens, lifted from css/common.css ────────────────────────── */
    :root {
      --color: #111;
      --background: #E3E5E6;
      --liquid-glass-background: white;
      --liquid-glass-border-color: var(--liquid-glass-background);
      --send: #FFFFFFEE;
      --blur-filter: blur(10px) saturate(180%);

      --border-radius-round: max(100vw, 100vh);

      --safearea-top: env(safe-area-inset-top, 0px);
      --safearea-bottom: env(safe-area-inset-bottom, 0px);
      --safearea-left: env(safe-area-inset-left, 0px);
      --safearea-right: env(safe-area-inset-right, 0px);

      --padding: min(max(2.4169dvw, 16px), 24px);
      --safearea-padding-top: calc(var(--safearea-top) + var(--padding));
      --safearea-padding-bottom: calc(var(--safearea-bottom) + var(--padding));

      --main-width: max(512px, 40%);
      --main-max-width: calc(100dvw - 2 * var(--padding));
      --chat-form-height: min(max(6.2840dvw, 48px), 56px);

      /* ── The portrait, lifted from css/common.css ───────────────── */

      /* How much of the screen Safari's floating bar is sitting over.
         No unit reports it and no inset describes it — measured on the
         device it came out one toolbar tall, and 100lvh - 100svh is the
         only expression of that the browser will give you. Falls back to
         0 where the units do not exist, which costs nothing. */
      --chrome-slack: 0px;

      /* The largest the viewport ever gets, plus another slack.
         
         This is css/common.css verbatim, and it is here now because the
         page WAS cut off at the bottom without it. Measured on the
         device: by every number the browser reports, 100lvh is the
         bottom of the screen; it is not. iOS paints a further toolbar's
         worth below it, behind its own floating bar, and the inset that
         is supposed to describe that region reads 0.
         
         The shell below stays 100dvh — that is the arrangement being
         tested and it does not change. This number is only for the
         photograph, which has to reach into a strip nothing can measure. */
      --hero-height: calc(100lvh + var(--chrome-slack) + env(safe-area-inset-bottom, 0px));

      /* The cut's own geometry, kept because the sink is derived from it
         and the sink changes how big the photograph is drawn. There is no
         cut here and no section for one to open onto, so --cut-rest is 0
         rather than the measured value JS writes on the real page. */
      --cut: 56px;              /* --cut-mobile; 120px over 900 */
      --cut-pivot: 0.8;
      --cut-rest: 0px;

      /* How far the portrait sinks below the first screen, so the diagonal
         passes UNDER its hard bottom edge instead of across it. The photo
         is cropped at the shoe, and anchored to the fold that flat edge
         reads as a cut of its own. Kept here even without a diagonal,
         because it is also what pushes the photograph's own bottom edge
         off the screen — which is exactly the thing that went wrong in
         ?solo. */
      --portrait-sink: calc(var(--cut-rest) + var(--cut) * var(--cut-pivot));

      /* 74.2vw is the mock's width — he is 0.36 of the window across in it,
         and at 0.485 of the crop that needs 0.742 of the window. The other
         term is the mock's height. On the mock's own aspect the height
         binds; on a tall narrow window the width binds instead and keeps
         him off the headline rather than letting a tall window inflate
         him. 0.858 is how much of the crop is him, measured off the file. */
      --portrait-crop: min(74.2vw, calc(0.9324 * var(--hero-height) + var(--portrait-sink) / 0.858));
      /* He is 77.5% of the crop's width, and the crop is 0.6260 as wide as
         it is tall (1252/2000) — so 0.485 of its height. */
      --portrait-width: calc(0.485 * var(--portrait-crop));
      /* What the headline and the icon row need at the top of a narrow
         screen. svh, not dvh: this sets how far down he starts, and a
         value that tracks the toolbar makes him drift up as you scroll. */
      --portrait-top: clamp(224px, 35svh, 300px);
      --portrait-height: var(--portrait-crop);

      /* How far below the shell his bottom edge has to land.
         
         The shell is 100dvh. He has to finish at --hero-height + sink,
         which is past it by the chrome slack twice over plus the sink —
         out in the strip that iOS paints and nothing measures. */
      --portrait-overhang: calc(var(--hero-height) + var(--portrait-sink) - 100dvh);
    }

    @supports (height: 1lvh) and (height: 1svh) {
      :root { --chrome-slack: calc(100lvh - 100svh); }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── The shell ─────────────────────────────────────────────────── */
    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;

      /*
       * He is the page's BACKGROUND, not a box on it, and that is the
       * whole trick.
       *
       * The root here has no background of its own, so body's propagates
       * to the canvas — and the canvas background's painting area is not
       * the element's box, it is the entire canvas. It is already the
       * thing painting the grey strip under Safari's floating bar, which
       * is the only proof needed that something CAN paint there.
       *
       * Positioning is still done against the root's box, which is the
       * dynamic viewport, so the bottom edge is pushed past it by the
       * overhang — and the part of the image that falls outside that box
       * still paints, because the painting area does not end where the
       * positioning area does.
       *
       * Three things were tried before this, and each failed for its own
       * reason, so none of them should come back:
       *
       *   absolute inside body — body is `overflow: hidden`, which clips
       *   its descendants to its own box, and its box is exactly 100dvh.
       *   His shoe was cut off at the fold.
       *
       *   overflow: clip on the shell instead of hidden — `hidden` is a
       *   scroll container that refuses the finger but not a function
       *   call, and the caller is Safari moving a focused field into
       *   view. Measured: scrollTo(500) took the page to 85. `clip`
       *   should not be a scroll container at all and in Chromium on the
       *   root it still went to 85.
       *
       *   position: fixed — escapes body's clip and adds nothing
       *   scrollable, and iOS clips fixed boxes to the LAYOUT viewport,
       *   which is innerHeight. So he stopped dead at 100dvh again, a
       *   little lower than before and no better. Will: "Bottom still
       *   opaque."
       *
       * In-flow content does reach that strip — the dark section was
       * measured there, visible, 40px below every number the browser
       * reports as the bottom of the screen. The canvas background
       * reaches it too, and unlike in-flow content it cannot be scrolled,
       * cannot be clipped, and costs no box at all.
       */
      background: var(--background)
                  url("assets/background.webp") no-repeat
                  right calc(100% + var(--portrait-overhang))
                  / auto var(--portrait-height);
      color: var(--color);
      font-family: Poppins, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 300;
      line-height: 1.5;

      padding: 0 var(--padding);
      padding-top: var(--safearea-padding-top);
      padding-bottom: var(--safearea-padding-bottom);
    }

    /* The spacer. This is the piece that makes the whole arrangement
       work: when the shell shrinks, this is what gives, and the bar is
       carried down rather than squeezed. Copied from css/chat-content.css
       including the odd-looking padding/margin pair — padding-top 24 with
       margin-bottom -24 — which is there so the scroll box has a gutter
       without the gutter costing layout height. */
    main {
      width: var(--main-width);
      max-width: var(--main-max-width);
      min-height: 0;

      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 8px;

      padding-top: 24px;
      margin-bottom: -24px;
      padding-bottom: 48px;
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* Vertical centring by auto margins rather than justify-content, so
       that an overflowing child still starts at the top instead of being
       cut off at both ends. */
    main::before,
    main::after { content: ""; margin: auto; }

    /* ── The headline ──────────────────────────────────────────────── */
    #welcome {
      --h1-size: min(max(3.6254vw, 28px), 32px);
      --h2-size: min(max(2.2961vw, 18px), 20px);
      --span-size: min(max(1.8127vw, 14px), 16px);

      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      justify-content: center;
      align-items: center;
      /* 80% ink. The headline is the loudest thing on the screen and at
         full strength it was louder than it needed to be. */
      color: rgb(from var(--color) r g b / 0.8);
      font-size: var(--span-size);
      text-align: center;
    }

    #welcome > div:first-of-type {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    #welcome .greeting,
    #welcome h1 {
      font-weight: 400;
      margin: 0;
      padding: 0;
      margin-inline: auto;
    }

    #welcome h1 { font-size: var(--h1-size); }

    #welcome .greeting {
      font-weight: 200;
      font-size: var(--h2-size);
    }

    #welcome b { font-weight: 500; }

    /*
     * "start?" in a serif italic against the Poppins of the rest of the
     * line — the one word the question turns on, and the only type
     * contrast on the page.
     *
     * 1.24em is an optical match, not a nominal one. Measured off the
     * canvas at 100px: Poppins has an x-height of 54.8 and Times italic
     * 44.19, so Times set at the same nominal size reads as a step DOWN.
     * 54.8 / 44.19 = 1.24 puts the x-heights level, which is the right
     * target for a word with no capital in it. (Cap-heights would want
     * only 1.05.)
     *
     * The stack ends in the generic `serif` on purpose: Times New Roman
     * ships on macOS and Windows but not on Android or most Linux, where
     * `serif` resolves to Noto Serif — a different face, but still a
     * serif italic against a sans, which is the whole point.
     */
    #welcome h1 .accent {
      font-family: "Times New Roman", Times, serif;
      font-style: italic;
      font-size: 1.24em;
    }

    /* ── The material ──────────────────────────────────────────────── */
    .liquid-glass {
      background: rgb(from var(--liquid-glass-background) r g b / 0.05);
      backdrop-filter: var(--blur-filter);
      -webkit-backdrop-filter: var(--blur-filter);
      --shadow1: inset -8px -8px 20px rgb(from var(--liquid-glass-border-color) r g b / 0.3);
      --shadow2: inset 0 0 0 1px rgb(from var(--liquid-glass-border-color) r g b / 0.1);
      --shadow3: 0 2px 8px rgba(0, 0, 0, 0.05);
      --shadow: var(--shadow1), var(--shadow2), var(--shadow3);
      box-shadow: var(--shadow);
      -webkit-box-shadow: var(--shadow);
    }

    /* ── The bar, and the chips that travel with it ────────────────── */
    #chat-input-container {
      position: relative;
      width: var(--main-width);
      max-width: var(--main-max-width);
      min-height: var(--chat-form-height);
      flex-shrink: 0;
      z-index: 999;
    }

    #chat-input-form {
      display: grid;
      grid-template-columns: auto 1fr auto;
      grid-template-rows: auto;
      border-radius: calc(0.5 * var(--chat-form-height) + 4px);
      padding: 8px;
    }

    #chat-input {
      grid-column: 2;
      grid-row: 1;
      width: 100%;
      max-height: 30svh;
      resize: none;
      overflow-x: hidden;
      overflow-y: auto;
      color: inherit;
      background: none;
      outline: none;
      box-shadow: none;
      cursor: text;

      margin: 0;
      /* 8px of form padding leaves the text against the rim of a bar
         this wide; 20 on the leading edge is simply the inset now. */
      padding: 0 8px 0 20px;
      border: 0;

      /* Written out longhand rather than as a `font:` shorthand. `font:
         ... inherit` is invalid — inherit cannot stand in for the family
         — so the whole declaration is dropped and the field falls back to
         the UA default, which measured 13.33px. In the page built to test
         the zoom. Caught by reading the computed value rather than the
         source. */
      font-family: inherit;
      font-weight: 400;
      /* 16px, and it cannot go below it: iOS Safari zooms the whole page
         in when you focus a field under 16px, which moved the portrait,
         ran the bar off both edges, and put every visualViewport number
         in zoomed units. 16 exactly, not larger, because the bar's height
         is built around this line box. */
      font-size: 16px;
      line-height: 1.5;
      align-self: center;
    }

    #chat-input::placeholder {
      color: inherit;
      font-style: italic;
      opacity: 0.7;
    }

    #send {
      grid-column: 3;
      grid-row: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      height: calc(var(--chat-form-height) - 16px);
      aspect-ratio: 1 / 1;
      border: 0;
      border-radius: var(--border-radius-round);
      background: var(--send);
      color: var(--color);
      cursor: pointer;
    }

    /* The row is one line and scrolls rather than wraps — the labels are
       topics rather than questions precisely so they fit, and a row that
       goes to three lines stops reading as a row of options.

       `safe center`: with plain `center` a row wider than its box
       overflows equally both ways and the left end becomes unreachable,
       because you cannot scroll to negative. `safe` falls back to
       flex-start exactly when that would happen.

       The width/translate pair pulls the row back out to the viewport
       from inside the 512px container, so it can be wider than the bar
       when the labels need it. `translate` rather than `transform`
       because on the real page transform is already spoken for by the
       entry animation. */
    #starter-chips {
      display: flex;
      flex-wrap: nowrap;
      justify-content: safe center;
      gap: 8px;
      width: max-content;
      max-width: var(--main-max-width);
      margin: 14px 0 0 50%;
      translate: -50% 0;
      overflow-x: auto;
      scrollbar-width: none;
      overscroll-behavior-x: contain;
      padding: 2px 0;
      touch-action: pan-x;
    }

    #starter-chips::-webkit-scrollbar { display: none; }

    /* On the real page scripts/starter-chips.js sets [overflowing] from
       the scroll position, so the fade is never on an edge with nothing
       behind it. There is no script here, so the end fade is written on
       the element in the markup and simply stays there. */
    #starter-chips[overflowing="end"] {
      mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent);
    }

    .starter-chip {
      flex: 0 0 auto;
      white-space: nowrap;
      font-family: inherit;
      /* 0.9em — 12.6px against the 14px body. These sit under a headline
         and a bar, four across, and at full size the row carried more
         weight than either. */
      font-size: 0.9em;
      text-align: left;
      /* 300, not the 400 a <button> inherits from the user agent: the
         body is 300 and the headline is 400, so a 400 chip was the
         heaviest text on a screen that is mostly whitespace, and four of
         them read as a toolbar rather than as suggestions.

         Held back to 72% so the row settles under the headline instead of
         competing with it. Over the page background that is about 11:1,
         miles clear of the 4.5:1 floor — and the phone block below puts
         it back to full strength, because there the chips sit on the
         portrait and a chip over the navy suit measured 4.9:1. */
      font-weight: 300;
      color: rgb(from var(--color) r g b / 0.72);
      text-decoration: none;

      -webkit-tap-highlight-color: transparent;
      border: 0;
      border-radius: var(--border-radius-round);
      padding: 9px 16px;
      cursor: pointer;
      max-width: 100%;
    }

    .chip--more {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* ── Phone ─────────────────────────────────────────────────────── */
    /* ── The opening state, on a wide screen ──────────────────────── */
    /*
     * On the real page the bar sits in the middle under the headline until
     * the first question moves it to the bottom, and the move is animated
     * through flex-grow so it glides rather than jumps. There is no first
     * question here, so this is only the half that holds still — but
     * without it the control looked nothing like the page it is a control
     * for on a desktop screen.
     *
     * The spacer is body::after because body is this page's shell; on the
     * real page it is .hero::after, for the same reason one level down.
     */
    body::after {
      content: "";
      flex: 0 0 0;
      min-height: 0;
    }

    @media only screen and (min-width: 901px) {
      /* 120px, not 56: the cut is deeper on a wide screen, so the sink is
         too, and the photograph is drawn to match. */
      :root { --cut: 120px; }

      /* On a wide enough screen he stands to the right and the writing
         keeps out of his way, which is how the design was drawn: headline,
         bar and chips in the space beside him, not across him. Padding the
         shell by his width makes that automatic — the column is centred by
         flexbox, and flexbox is now centring it in what is left. */
      body {
        padding-left: var(--padding);
        padding-right: calc(var(--padding) + var(--portrait-width));
      }

      /* The max-width override is as load-bearing as the padding.
         --main-width is max(512px, 40%) and --main-max-width is measured
         off the VIEWPORT, which knows nothing about the space reserved for
         him — so without this a 512px bar ignores the narrowed column and
         runs under him anyway. */
      main, #chat-input-container, #starter-chips { max-width: 100%; }

      /* Half the slack above the bar, half below: the bar lands in the
         middle. */
      body::after { flex-grow: 1; }

      /* Centre the whole left column, not just the bar. main carries
         `flex: 1`, which is a basis of ZERO — so main and the spacer grew
         from nothing by the same amount and came out the same height,
         which centres the BAR and leaves the headline hanging above the
         middle with nothing to balance it. A basis of auto makes main
         start at the height of its content and grow from there, so it ends
         up taller than the spacer by exactly the headline block. */
      main {
        flex-basis: auto;
        /* main's own top padding would otherwise land entirely above the
           headline and push the group down by that much. */
        padding-top: 0;
      }

      /* main centres its children with `margin: auto` on both pseudos, so
         main's extra height lands half above and half below the headline
         and the group drifts up. Releasing the trailing one leaves the
         leading auto margin to take all the slack, which puts the headline
         at the bottom of main — directly above the bar. */
      main::after { margin: 0; }

      #welcome {
        /* Content height, so main's auto basis means something. */
        height: auto;
        justify-content: flex-end;
        /* The only gap between the headline and the bar. At 4px they read
           as one stack rather than as a heading and a control. */
        padding-bottom: 32px;
      }
    }

    @media only screen and (max-width: 900px) {
      /* At crop height he is taller than the phone is wide, so he fills the
         screen and the headline, the chips and the bar all sit on top of
         him. Sizing him to what is left under the headline instead keeps
         the top of the screen clear and puts the chips and the bar over his
         legs, which is the glass doing its job rather than a collision.
         
         The sink is ADDED rather than spent pushing him down: the bottom is
         nailed to the lowest point the cut ever reaches, so it cannot move,
         and a taller draw raises his head by the difference. */
      :root {
        --portrait-height: calc(100svh - var(--portrait-top) + var(--portrait-sink));
      }

      #welcome { justify-content: flex-start; }
      #welcome > div:first-of-type { gap: 8px; }

      /* The bar is already at the bottom on a phone, so the chips go
         above it rather than off the end of the screen. */
      #chat-input-container { display: flex; flex-direction: column; }
      #starter-chips { order: -1; margin: 0 0 14px 50%; }

      /* Full strength here. On the real page these sit ON the portrait
         and which chip you can read depends on what is behind it; the
         held-back ink is there to stop four chips competing with the
         headline, and over the suit there is no headline nearby to
         compete with. Kept even though this page has no portrait, so the
         two screens match. */
      .starter-chip { color: var(--color); }
      .starter-chip.liquid-glass {
        background: rgb(from var(--liquid-glass-background) r g b / 0.5);
        --shadow2: inset 0 0 0 1px rgb(from var(--liquid-glass-border-color) r g b / 0.4);
      }
    }

    @media only screen and (max-width: 512px) {
      #chat-input-form.liquid-glass {
        background: rgb(from var(--liquid-glass-background) r g b / 0.5);
        --shadow2: inset 0 0 0 1px rgb(from var(--liquid-glass-border-color) r g b / 0.4);
      }
    }
  </style>
</head>
<body>

  <main id="content">
    <div id="welcome">
      <div>
        <!-- A <p>, not an <h2>: it reads as a line above the title, and
             as an h2 it put a level two ahead of the level one for anyone
             moving through the page by heading. -->
        <p class="greeting">Hi, I'm <b>William</b> Brendel</p>
        <h1>Where should we <span class="accent">start?</span></h1>
      </div>
    </div>
  </main>

  <div id="chat-input-container">
    <form id="chat-input-form" class="liquid-glass" onsubmit="return false">
      <textarea id="chat-input" placeholder="Ask me anything…" rows="1"
                autocomplete="off" autocorrect="off" autocapitalize="off"
                spellcheck="false"></textarea>
      <button id="send" type="submit" aria-label="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
        </svg>
      </button>
    </form>

    <!-- The four real starters (server/config.js STARTERS) and the More
         chip, hard-coded. On the real page scripts/starter-chips.js
         fetches them and holds More across the rebuild. -->
    <div id="starter-chips" aria-label="Suggested questions" overflowing="end">
      <button class="starter-chip liquid-glass" type="button">A time I failed</button>
      <button class="starter-chip liquid-glass" type="button">A time I disagreed</button>
      <button class="starter-chip liquid-glass" type="button">A call under pressure</button>
      <button class="starter-chip liquid-glass" type="button">My biggest obstacle</button>
      <a class="starter-chip chip--more liquid-glass" href="#">
        More
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/>
        </svg>
      </a>
    </div>
  </div>

</body>
</html>
