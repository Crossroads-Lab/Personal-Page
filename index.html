<!DOCTYPE html>
<html lang="en-us">
  <head>
    <!-- Document title -->
    <title>William Brendel, PhD in AI | Product Strategist & Machine Learning Expert</title>

    <!-- Default meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
    <!-- Apple: Transparent Mode notch color -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- Android/Chrome: Dark Mode notch color -->
    <meta name="theme-color" content="#E4E6E7" media="(prefers-color-scheme: dark)">
    <!-- Android/Chrome: Light Mode notch color -->
    <meta name="theme-color" content="#E4E6E7" media="(prefers-color-scheme: light)">

    <!-- Fonts -->
    <!-- Preconnect to Google Fonts for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Preload fonts asynchronously to improve initial page load -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <!-- Fallback for browsers with JavaScript disabled -->
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet"
        type="text/css"
      />
    </noscript>

    <!-- Favicon -->
    <link href="assets/favicon.png" rel="icon" type="image/png">

    <!-- Other links, like styles -->
    <link href="css/index.css?v=63ca79a9" rel="stylesheet" type="text/css">

    <!-- Page script -->
    <script src="scripts/index.js?v=12271a9b" type="module" defer></script>

    <!-- Canonical url -->
    <link href="https://william-brendel.com/" rel="canonical">

    <!-- SEO | Generic -->
    <meta name="description" content="I'm a Product Strategist & Machine Learning Expert">
    <meta name="image" content="assets/profile.webp">
    
    <!-- SEO | Open Graph meta tags -->
    <meta property="og:locale" content="en_US">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://william-brendel.com/">
    <meta property="og:site_name" content="William Brendel">
    <meta property="og:title" content="Product Strategist & Machine Learning Expert" />
    <meta property="og:description" content="Book a session with William Brendel or download his resume." />
    <meta property="og:image" content="https://william-brendel.com/assets/profile.webp" />
    <meta property="og:image:alt" content="William Brendel's profile picture">
     
    <!-- SEO | Twitter/X card tags -->
    <meta property="twitter:card" content="summary">
    <meta property="twitter:creator" content="@iamnotanaibot">
    <meta property="twitter:description" content="Book a session with William Brendel or download his resume.">
    <meta property="twitter:title" content="Product Strategist & Machine Learning Expert">
    <meta property="twitter:image" content="https://william-brendel.com/assets/profile.webp">
    <meta property="twitter:image:alt" content="William Brendel's profile picture">
    
    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfilePage",
        "mainEntity": {
          "@type": "Person",
          "name": "William Brendel",
          "description": "Product Strategist & Machine Learning Expert",
          "image": "https://william-brendel.com/assets/profile.webp",
        }
      }
    </script>
  </head>
  <body loading>
    <!-- Main content area where chat messages will be displayed -->
    <main id="content">
      <div id="welcome">
        <div>
          <h2>Hi, I'm <b>William</b> Brendel</h2>
          <h1>Where should we <span class="accent">start?</span></h1>
          <!--
            The four destinations, as icons. Filled by scripts/quick-links.js
            from #destinations at the end of this file, so the hrefs live in
            exactly one place.
            Inside #welcome on purpose: that block sits at the bottom of main
            on a wide screen (just above the input bar) and at the top of the
            page on a phone (with the headline), which is both placements
            without a second rule.
          -->
          <div id="quick-links" aria-label="Links"></div>
        </div>
      </div>
    </main>
    <div id="chat-input-container">
      <!--
        The icon row, again, for the conversation view. #welcome and the row
        inside it are wiped by the first question (content.innerHTML = ""),
        and these links have to outlive that — a page meant to be opened off
        a business card cannot drop its links the moment someone asks it
        something. Hidden until then by CSS, because before the first
        question the copy under the headline is the one to look at.

        Two containers, still one list: scripts/quick-links.js builds both
        from #destinations below.
      -->
      <div id="quick-links-docked" aria-label="Links"></div>
      <!-- User input form -->
      <form id="chat-input-form" class="liquid-glass">
        <!-- Left-side input actions. Empty since the ⋮ menu was removed, and
             kept only because chat-input-form.js measures its width when the
             textarea goes multiline. CSS pins it to zero. -->
        <div id="chat-input-left-buttons"></div>

        <!-- Main chat textarea -->
        <textarea
          id="chat-input"
          placeholder="Ask me anything…"
          rows="1"
        ></textarea>

        <!-- Right-side input actions (send, voice, etc.) -->
        <div id="chat-input-right-buttons">
          <button id="send" class="liquid-glass" title="Send your question">
            <img src="assets/icons/arrow-up.svg">
          </button>
          <button id="stop" class="liquid-glass" type="button" title="Click to stop thinking">
            <div></div>
          </button>
        </div>
      </form>

      <!--
        Opening suggestions. Inside the input container so they travel with
        the bar: below it on desktop, above it on mobile (CSS `order`), where
        the bar already sits at the bottom. Filled by
        scripts/starter-chips.js; empty, it takes no space.
      -->
      <div id="starter-chips" aria-label="Suggested questions"></div>
    
    </div>

    <!--
      THE one list of destinations. Never shown: it is the source every other
      rendering is built from — the icon rows above (scripts/quick-links.js)
      and the buttons under an answer (scripts/chat-input-form.js). Change a
      URL here and it changes everywhere, which is the whole point of keeping
      it after the ⋮ menu that used to display it was removed.

      The words matter as much as the hrefs: they become the icons' tooltips
      and accessible names, and the labels on the answer buttons.
    -->
    <div id="destinations" hidden>
      <a id="dest-linkedin" class="button" title="Click to go to my LinkedIn page" href="https://www.linkedin.com/in/william-brendel" target="_blank">
        View my LinkedIn
        <img src="assets/icons/linkedin.svg"/>
      </a>
      <button id="dest-share-profile" class="buttons">
        Share my profile
        <img src="assets/icons/share.svg"/>
      </button>
      <a id="dest-book-call" class="button" title="Click to book a 30min call with me" href="https://calendly.com/william-brendel/30min" target="_blank">
        Book 30min with me
        <img src="assets/icons/call.svg"/>
      </a>
      <a id="dest-resume" class="button" title="Click to download my resume" href="assets/William Brendel Resume - 2026.pdf" target="_blank">
        Download my resume
        <img src="assets/icons/resume.svg"/>
      </a>
    </div>
    <svg style="display: none;">
      <filter id="liquid-glass-distortion" x="0%" y="0%" width="100%" height="100%" filterUnits="objectBoundingBox">
        <!-- feTurbulence creates a noise pattern for the distortion -->
        <feTurbulence type="fractalNoise" baseFrequency="0.01 0.01" numOctaves="1" seed="0" result="turbulence" />
        <!-- feDisplacementMap uses the noise pattern to warp the image beneath -->
        <feDisplacementMap in2="turbulence" in="SourceGraphic" scale="5" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
  </body>
</html>
