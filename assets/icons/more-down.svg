<!-- A chevron, and nothing else.
     
     The first version put it inside a ring, which at the 16px the row
     draws icons at left the arrow itself about five pixels across — a dark
     dot in a circle. The ring was decoration competing with the only part
     that carries meaning. This fills the same 18x18 the other marks use
     and is solid, so it holds its weight beside them. -->
