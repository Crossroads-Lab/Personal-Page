<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- A CV: a page with a person on it, and the text below rather than beside.
     Nothing sits next to the portrait, and ONE broken line rather than two
     full ones: at 16px two stacked bars turned into a smudge under the
     figure, where a single interrupted line still reads as writing.
     One path with fill-rule evenodd, so the portrait and the lines are holes
     in the page rather than shapes laid over it: the icon is tinted by a
     filter and sits on glass, so anything opaque reads as a colour patch.
     (No double hyphen in this comment. SVG is XML, and two of them make the
     file unparseable, which is how an earlier version broke silently.) -->
